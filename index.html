<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>魔法相簿～暖暖拍照小天地</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S5KY9QYQ3F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-S5KY9QYQ3F');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@1&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0c0a22;--paper:#171244;--paper2:#201a58;--ink:#ece8ff;--muted:#b3abe6;--line:#4b3f9a;--gold:#e6c27a;--wax:#c58bff;--danger:#e05a6d;--shadow:rgba(0,0,0,.65);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
    html{scroll-padding-top:env(safe-area-inset-top,0px)}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 "Noto Serif TC",serif;background-image:radial-gradient(ellipse at 20% 0,rgba(120,80,255,.38),transparent 55%),radial-gradient(ellipse at 90% 30%,rgba(40,110,255,.24),transparent 50%),radial-gradient(1.5px 1.5px at 12% 22%,#fff9,transparent),radial-gradient(1.5px 1.5px at 38% 8%,#fff9,transparent),radial-gradient(1px 1px at 63% 18%,#fff9,transparent),radial-gradient(1.5px 1.5px at 84% 9%,#fffb,transparent);background-attachment:fixed}
    .fell{font-family:"IM Fell English",serif;font-style:italic;letter-spacing:.02em}
    .book{max-width:1020px;margin:0 auto;padding:20px 14px 56px}
    header{text-align:center;padding:28px 8px 10px}
    header h1{margin:0;font:900 clamp(34px,8.5vw,60px)/1.2 "Noto Serif TC",serif;letter-spacing:.12em;color:var(--ink);text-shadow:0 0 22px rgba(170,130,255,.75),0 0 3px rgba(255,255,255,.4)}
    header .sub{margin:6px 0 0;font-size:clamp(16px,4vw,22px);color:var(--gold);letter-spacing:.3em}
    header .en{margin:10px 0 0;color:var(--muted);font-size:18px}
    nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:22px 0 0}
    nav button,.house button{font:inherit;cursor:pointer;color:var(--ink);background:var(--paper2);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:8px 18px 10px;min-height:44px}
    nav button small{display:block;font:italic 13px/1.2 "IM Fell English",serif;color:var(--muted)}
    nav button[aria-selected="true"]{background:var(--paper);font-weight:600;box-shadow:0 -3px 0 var(--wax) inset}
    .page{display:none;background:var(--paper);border:1px solid var(--line);border-radius:4px 4px 14px 14px;padding:28px 20px 38px;position:relative;box-shadow:0 14px 40px var(--shadow),0 0 60px rgba(110,80,255,.2)}
    .page.on{display:block}
    .page::before{content:"";position:absolute;inset:7px;border:1px solid var(--line);border-radius:3px;pointer-events:none;opacity:.7}
    h2{margin:0 0 4px;font:900 26px/1.4 "Noto Serif TC",serif;text-align:center;letter-spacing:.06em}
    .lead{text-align:center;color:var(--muted);margin:0 0 16px}
    .orn{display:block;margin:0 auto 24px;width:160px;height:12px;color:var(--gold)}
    .btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#2d2473,#1e1754);color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:7px 14px;font:600 14px/1.4 "Noto Serif TC",serif;cursor:pointer}
    .btn-sm{padding:4px 10px;font-size:13px;border-radius:4px}
    .btn-danger{border-color:var(--danger);color:#ffb3be;background:rgba(140,30,48,.35)}
    .btn-ghost{background:transparent;border-color:var(--line);color:var(--muted)}
    .admin-bar{display:none;background:rgba(36,28,92,.95);border:1px solid var(--gold);border-radius:8px;padding:10px 16px;margin-bottom:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
    body.is-admin .admin-bar{display:flex}
    .admin-only{display:none!important}
    body.is-admin .admin-only{display:inline-flex!important}
    .section-toolbar{display:flex;justify-content:center;margin-bottom:22px}
    .event{margin:0 0 42px;padding-bottom:28px;border-bottom:1px dashed rgba(110,95,200,.4)}
    .event:last-of-type{border-bottom:0;margin-bottom:10px;padding-bottom:0}
    .event-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .event h3{margin:0;font:600 22px/1.4 "Noto Serif TC",serif}
    .date{color:var(--wax);font-size:14px;margin-top:2px}
    .event p{margin:8px 0 18px;max-width:65ch;color:#dcd6ff}
    .snap{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:20px 16px}
    .pol{background:#efeaff;padding:8px 8px 24px;box-shadow:0 6px 14px var(--shadow);position:relative;transform:rotate(var(--r,-1.5deg));margin:0;cursor:zoom-in;transition:transform .2s}
    .pol:nth-child(2n){--r:1.8deg}.pol:nth-child(3n){--r:-2.2deg}.pol:nth-child(5n){--r:.9deg}
    .pol::before{content:"";position:absolute;top:-9px;left:50%;width:54px;height:18px;margin-left:-27px;background:rgba(160,130,255,.52);transform:rotate(-3deg);pointer-events:none}
    .pol:hover{transform:rotate(0) scale(1.035);z-index:2}
    .pol img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#231c5c}
    .ph{background:linear-gradient(150deg,hsl(var(--h,250) 38% 58%),hsl(calc(var(--h,250) + 30) 40% 30%));display:grid;place-items:center;color:rgba(255,248,225,.85);font:italic 14px "IM Fell English",serif;text-align:center;padding:6px}
    .pol figcaption{position:absolute;bottom:4px;left:8px;right:8px;text-align:center;font-size:12px;color:#463c7a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .house{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 24px}
    .house button{border-bottom:1px solid var(--line);border-radius:4px 4px 18px 18px;padding:8px 16px 10px;border-top:5px solid var(--c)}
    .house button[aria-pressed="true"]{background:var(--c);color:var(--t);font-weight:600}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#efeaff;color:#241c52;border:1px solid #b8aaf0;border-top:8px solid var(--c);padding:12px;box-shadow:0 6px 16px var(--shadow);border-radius:3px;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
    body.is-admin .card[draggable="true"]{cursor:grab}
    body.is-admin .card.dragging{opacity:.45;transform:scale(.98)}
    body.is-admin .card.drag-over{outline:2px dashed var(--gold);outline-offset:3px}
    .card-portrait{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:2px;cursor:zoom-in}
    .card h4{margin:10px 0 0;font:900 19px/1.3 "Noto Serif TC",serif}
    .card .hn{font-size:13px;font-weight:600;color:var(--c2)}
    .card .ttl{margin:3px 0 10px;color:#524885;font-size:14px;font-style:italic}
    .mini{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
    .mini img,.mini .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;cursor:zoom-in}
    .card-actions{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px dashed #c2b6f2}
    .scroll-wrapper{position:relative;margin:10px auto 0;padding:0 18px;max-width:920px}
    .scroll-roller{position:absolute;top:-8px;bottom:-8px;width:24px;border-radius:12px;background:linear-gradient(90deg,#1b153d,#483b8c 35%,#e6c27a 50%,#3a2e75 70%,#120d2b);border:1px solid var(--gold);box-shadow:0 0 18px rgba(0,0,0,.85);z-index:5;pointer-events:none}
    .scroll-roller::before,.scroll-roller::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:30px;height:14px;border-radius:4px;background:radial-gradient(circle at 30% 30%,#ffe6a8,#b88a38);border:1px solid #593e10}
    .scroll-roller::before{top:-10px}.scroll-roller::after{bottom:-10px}
    .scroll-roller.left{left:4px}.scroll-roller.right{right:4px}
    .map-viewport{position:relative;aspect-ratio:16/11;min-height:360px;border-radius:4px;overflow:hidden;border-top:2px solid rgba(230,194,122,.55);border-bottom:2px solid rgba(230,194,122,.55);background:radial-gradient(circle at 50% 45%,rgba(62,51,138,.48),rgba(22,17,56,.92) 72%,rgba(11,8,32,.98));box-shadow:inset 24px 0 36px rgba(5,3,18,.9),inset -24px 0 36px rgba(5,3,18,.9),0 12px 30px rgba(0,0,0,.75);touch-action:none;user-select:none}
    .map-stage{position:absolute;inset:0;transform-origin:center center;transition:transform .2s ease-out}
    .map-stage.dragging{transition:none;cursor:grabbing}
    .map-stage svg{width:100%;height:100%;display:block}
    .map-controls{position:absolute;top:12px;right:16px;display:flex;gap:6px;z-index:6}
    .map-controls button{width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);background:rgba(18,14,48,.85);color:var(--gold);font:700 18px/1 sans-serif;cursor:pointer;display:grid;place-items:center}
    .map-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(12,10,38,.82);border:1px solid rgba(230,194,122,.4);color:var(--gold);font-size:12px;padding:3px 12px;border-radius:20px;pointer-events:none;z-index:4;white-space:nowrap}
    .pin{position:absolute;transform:translate(-50%,-50%);background:none;border:0;cursor:pointer;color:#fff6dc;font:600 13px/1.2 "Noto Serif TC",serif;text-align:center;padding:4px;min-width:44px;min-height:44px;z-index:3}
    .pin i{display:block;margin:0 auto 3px;width:15px;height:15px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#8b6eff;border:2px solid var(--gold);box-shadow:0 0 8px rgba(230,194,122,.7)}
    .pin span{display:inline-block;background:rgba(14,11,42,.88);border:1px solid rgba(230,194,122,.4);padding:1px 5px;border-radius:4px;font-size:11px;white-space:nowrap;opacity:.88;transition:all .2s}
    .pin:hover,.pin[aria-pressed="true"]{z-index:10}.pin:hover span,.pin[aria-pressed="true"] span{font-size:13px;padding:2px 8px;opacity:1;border-color:var(--gold);color:var(--gold);background:rgba(34,26,84,.96);box-shadow:0 0 12px rgba(230,194,122,.5)}
    .pin[aria-pressed="true"] span{border-color:var(--gold);color:var(--gold);background:rgba(34,26,84,.95)}
    .spot{margin-top:24px;padding:20px;background:var(--paper2);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px}
    .spot-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.spot h3{margin:0;font:900 21px/1.3 "Noto Serif TC",serif;color:var(--gold)}
    .spot-desc{margin:6px 0 16px;color:#e2dcff;font-size:15px}
    .lightbox{position:fixed;inset:0;background:rgba(7,5,22,.94);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
    .lightbox.open{display:flex}
    .lb-inner{max-width:92vw;max-height:90vh;display:flex;flex-direction:column;align-items:center}
    .lb-img{max-width:90vw;max-height:76vh;border:6px solid #efeaff;border-radius:3px;object-fit:contain}
    .lb-cap{margin-top:12px;text-align:center;color:var(--ink);font-size:15px}
    .lb-cap small{display:block;color:var(--gold);font-size:13px}
    .lb-close,.lb-prev,.lb-next{position:fixed;background:rgba(28,22,74,.85);border:1px solid var(--gold);color:var(--gold);width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer;display:grid;place-items:center}
    .lb-close{top:18px;right:20px}.lb-prev{left:16px;top:50%;transform:translateY(-50%)}.lb-next{right:16px;top:50%;transform:translateY(-50%)}
    .modal-backdrop{position:fixed;inset:0;background:rgba(8,6,26,.86);display:none;align-items:center;justify-content:center;z-index:900;padding:16px;overflow-y:auto}
    .modal-backdrop.open{display:flex}
    .modal{background:var(--paper);border:1px solid var(--gold);border-radius:10px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column}
    .modal h3{margin:0 0 10px;font:900 20px "Noto Serif TC",serif;color:var(--gold)}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
    .field input[type="text"],.field input[type="number"],.field input[type="date"],.field textarea,.field select{width:100%;background:#100c30;border:1px solid var(--line);border-radius:6px;padding:9px 12px;color:var(--ink);font:inherit}
    .field textarea{min-height:80px;resize:vertical}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
    .preview-item{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
    .preview-item img{width:100%;height:100%;object-fit:cover}
    .preview-item button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(180,30,50,.9);color:#fff;cursor:pointer}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);flex-shrink:0}
    footer{margin-top:34px;text-align:center;color:var(--muted);font-size:14px}
    .admin-trigger{background:none;border:1px solid rgba(179,171,230,.3);color:var(--muted);border-radius:20px;padding:4px 14px;font-size:12px;cursor:pointer;margin-top:10px}
    /* 圖片裁切視窗樣式 */
.crop-box{position:relative;width:100%;max-width:360px;margin:10px auto;background:#08061a;border:1px solid var(--line);border-radius:6px;overflow:hidden;touch-action:none;user-select:none}
.crop-box img{display:block;width:100%;height:auto;pointer-events:none}
.crop-mask{position:absolute;inset:0;background:rgba(8,6,26,.65);pointer-events:none}
.crop-frame{position:absolute;border:2px solid var(--gold);box-shadow:0 0 0 9999px rgba(8,6,26,.65);cursor:move;touch-action:none}
.crop-handle{position:absolute;right:-8px;bottom:-8px;width:20px;height:20px;background:var(--gold);border:2px solid #171244;border-radius:50%;cursor:nwse-resize;touch-action:none}
/* 測測你今日的幸運巫師 - 水晶球互動樣式（PC + 手機一屏自適應） */
    .oracle-trigger-wrap{display:flex;justify-content:center;margin:0 0 22px}
    .oracle-btn{position:relative;display:inline-flex;align-items:center;gap:12px;background:radial-gradient(circle at 30% 25%,rgba(197,139,255,.28),rgba(28,20,84,.95) 70%);border:1px solid var(--gold);border-radius:999px;padding:10px 24px 10px 14px;color:var(--gold);font:600 15px/1.4 "Noto Serif TC",serif;cursor:pointer;box-shadow:0 0 22px rgba(197,139,255,.28),inset 0 0 12px rgba(230,194,122,.22);transition:transform .2s,box-shadow .2s}
    .oracle-btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(230,194,122,.5),inset 0 0 16px rgba(197,139,255,.38)}
    .orb-mini{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff6ff,#c58bff 38%,#4b3f9a 76%,#161042);box-shadow:0 0 12px #c58bff,inset 0 -3px 6px rgba(0,0,0,.6);position:relative;flex-shrink:0}
    .orb-mini::after{content:"";position:absolute;top:5px;left:6px;width:7px;height:4px;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-25deg)}
    .oracle-stage{text-align:center;padding:2px 2px 0;display:flex;flex-direction:column}
    .crystal-ball-wrap{position:relative;width:152px;height:152px;margin:8px auto 14px;display:grid;place-items:center;cursor:pointer}
    .crystal-halo{position:absolute;inset:-12px;border-radius:50%;border:1px dashed rgba(230,194,122,.55);animation:orbSpin 14s linear infinite;pointer-events:none}
    .crystal-halo::before{content:"✦";position:absolute;top:-9px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:13px}
    .crystal-ball{width:132px;height:132px;border-radius:50%;position:relative;overflow:hidden;display:grid;place-items:center;padding:14px;background:radial-gradient(circle at 32% 26%,rgba(255,250,255,.92) 0%,rgba(216,176,255,.68) 22%,rgba(94,68,196,.85) 58%,rgba(19,13,56,.98) 100%);border:2px solid rgba(230,194,122,.75);box-shadow:0 0 34px rgba(197,139,255,.55),0 0 64px rgba(120,80,255,.35),inset 0 -14px 26px rgba(10,6,34,.85);transition:transform .25s,box-shadow .25s}
    .crystal-ball::before{content:"";position:absolute;top:14px;left:24px;width:34px;height:16px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(2px);transform:rotate(-28deg);pointer-events:none}
    .crystal-ball::after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,rgba(230,194,122,.35),transparent,rgba(197,139,255,.45),transparent);opacity:0;pointer-events:none}
    .crystal-ball-wrap:hover .crystal-ball{transform:scale(1.04);box-shadow:0 0 42px rgba(230,194,122,.65),0 0 75px rgba(197,139,255,.45),inset 0 -14px 26px rgba(10,6,34,.85)}
    .crystal-ball-wrap.divining .crystal-ball{animation:orbPulse .45s ease-in-out infinite alternate;box-shadow:0 0 55px rgba(230,194,122,.9),0 0 95px rgba(197,139,255,.8),inset 0 0 24px rgba(255,244,210,.6)}
    .crystal-ball-wrap.divining .crystal-ball::after{opacity:1;animation:orbSpin 1.1s linear infinite}
    .crystal-ball-wrap.divining .crystal-halo{animation-duration:1.4s;border-color:var(--gold)}
    .crystal-text{position:relative;z-index:2;color:#fff9ea;font:900 15px/1.35 "Noto Serif TC",serif;text-shadow:0 0 10px rgba(16,10,48,.95),0 0 18px rgba(230,194,122,.8)}
    .crystal-base{width:86px;height:14px;margin:-10px auto 4px;border-radius:50%;background:linear-gradient(180deg,#e6c27a,#7d5a1e);border:1px solid #ffe8ad;box-shadow:0 6px 14px rgba(0,0,0,.75)}
    /* PC 與手機皆採左右並排緊湊卡片，確保一屏完整顯示不需捲動 */
    .oracle-card{display:grid;grid-template-columns:150px 1fr;grid-template-rows:auto auto auto 1fr;column-gap:14px;text-align:left;max-width:460px;margin:4px auto 0;background:#efeaff;color:#241c52;border:1px solid #b8aaf0;border-top:7px solid var(--c,#8b6eff);border-radius:6px;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.75),0 0 28px rgba(230,194,122,.35);animation:oracleReveal .45s cubic-bezier(.2,.85,.3,1.1)}
    .oracle-card > img,.oracle-card > .ph{grid-row:1 / -1;grid-column:1;width:100%;height:100%;max-height:220px;aspect-ratio:3/4;object-fit:cover;border-radius:4px}
    .oracle-card h4{grid-column:2;margin:2px 0 2px;font:900 19px/1.25 "Noto Serif TC",serif}
    .oracle-card .hn{grid-column:2;font-size:12px;font-weight:600;color:var(--c2,#4b3f9a)}
    .oracle-card .ttl{grid-column:2;margin:4px 0 8px;color:#524885;font-size:13px;font-style:italic;line-height:1.4}
    .oracle-card .mini{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start;align-self:end}
    .oracle-card .mini img,.oracle-card .mini .ph{width:100%;height:auto;max-height:none;aspect-ratio:1 / 1;object-fit:cover;border-radius:3px;cursor:zoom-in}
    .oracle-stage .modal-footer{margin-top:14px;padding-top:12px}
    @keyframes orbSpin{to{transform:rotate(360deg)}}
    @keyframes orbPulse{from{transform:scale(1)}to{transform:scale(1.07)}}
    @keyframes oracleReveal{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
    /* 編輯視窗照片拖曳排序樣式 */
    .preview-item[draggable="true"]{cursor:grab}
    .preview-item.dragging{opacity:.45;transform:scale(.97)}
    .preview-item.drag-over{outline:2px dashed var(--gold);outline-offset:2px}
    @media(max-width:600px){
      .modal{padding:12px 12px 14px;max-height:92dvh}
      .modal h3{font-size:16px;margin-bottom:6px}
      .oracle-stage p{font-size:12px!important;margin-bottom:8px!important}
      .crystal-ball-wrap{width:116px;height:116px;margin:4px auto 10px}
      .crystal-ball{width:102px;height:102px;padding:10px}
      .crystal-text{font-size:13px}
      .crystal-base{width:66px;height:11px;margin:-8px auto 2px}
      .oracle-card{grid-template-columns:108px 1fr;column-gap:10px;padding:9px;border-top-width:6px}
      .oracle-card > img,.oracle-card > .ph{max-height:160px}
      .oracle-card h4{font-size:16px;margin:0 0 1px}
      .oracle-card .hn{font-size:11px}
      .oracle-card .ttl{font-size:12px;margin:3px 0 6px}
      .oracle-card .mini{gap:4px}
      .oracle-card .mini img,.oracle-card .mini .ph{height:auto;max-height:none;aspect-ratio:1 / 1}
      .oracle-stage .modal-footer{margin-top:10px;padding-top:10px;gap:8px}

async function compressImage(file, maxDim = 1400, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const c = document.createElement("canvas");
        c.width = width; c.height = height;
        c.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const StorageAdapter = {
  db: null,
  isCloud() { return Boolean(window.FB && window.FB.db); },
  initLocal() {
    return new Promise((res, rej) => {
      const req = indexedDB.open("MagicAlbumDB_v5", 1);
      req.onupgradeneeded = (e) => { if (!e.target.result.objectStoreNames.contains("album")) e.target.result.createObjectStore("album"); };
      req.onsuccess = (e) => { this.db = e.target.result; res(); };
      req.onerror = rej;
    });
  },
  async load() {
    const badge = document.getElementById("storageBadge");
    if (this.isCloud()) {
      try {
        const snap = await window.FB.getDoc(window.FB.doc(window.FB.db, "album", "root"));
        if (badge) badge.textContent = "雲端同步模式（Firestore + Cloudinary）";
        if (snap.exists()) {
          await this.saveLocal(snap.data());
          return snap.data();
        } else {
          const d = JSON.parse(JSON.stringify(DEFAULT_DATA));
          await this.save(d);
          return d;
        }
      } catch (err) {
        console.error("雲端讀取失敗，改用本機備援：", err);
        if (badge) badge.textContent = "離線備援模式（IndexedDB）";
      }
    } else if (badge) {
      badge.textContent = "本機儲存模式（IndexedDB）";
    }
    return this.loadLocal();
  },
  async save(data) {
    await this.saveLocal(data);
    if (this.isCloud()) {
      await window.FB.setDoc(window.FB.doc(window.FB.db, "album", "root"), data);
    }
  },
  async uploadDataUrl(dataUrl, folder = "photos") {
    const cfg = window.CLOUDINARY_CONFIG;
    if (!cfg || !cfg.cloudName || !cfg.uploadPreset || !dataUrl.startsWith("data:")) {
      return dataUrl;
    }
    const formData = new FormData();
    formData.append("file", dataUrl);
    formData.append("upload_preset", cfg.uploadPreset);
    formData.append("folder", `magic-album/${folder}`);

    const res = await fetch(`https://api.cloudinary.com/v1_1/${cfg.cloudName}/image/upload`, {
      method: "POST",
      body: formData
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error("Cloudinary 上傳失敗：" + errText);
    }
    const json = await res.json();
    return json.secure_url;
  },
  async loadLocal() {
    if (!this.db) await this.initLocal();
    return new Promise((res) => {
      const req = this.db.transaction("album", "readonly").objectStore("album").get("root");
      req.onsuccess = () => res(req.result || JSON.parse(JSON.stringify(DEFAULT_DATA)));
      req.onerror = () => res(JSON.parse(JSON.stringify(DEFAULT_DATA)));
    });
  },
  async saveLocal(data) {
    if (!this.db) await this.initLocal();
    return new Promise((res, rej) => {
      const req = this.db.transaction("album", "readwrite").objectStore("album").put(data, "root");
      req.onsuccess = () => res();
      req.onerror = rej;
    });
  }
};

 renderMap() {
    const regions = [...new Set(this.data.spots.map((s) => s.name.includes("－") ? s.name.split("－").at(0) : "其他秘境"))];
    if (!regions.includes(this.activeRegion)) this.activeRegion = regions.at(0) || "";

    const filtered = this.data.spots.filter((s) => (s.name.includes("－") ? s.name.split("－").at(0) : "其他秘境") === this.activeRegion);
    if (!filtered.some((s) => s.id === this.activeSpotId) && filtered.length) {
      this.activeSpotId = filtered.at(0).id;
    }

    let tabsEl = document.getElementById("regionTabs");
    if (!tabsEl) {
      tabsEl = document.createElement("div");
      tabsEl.id = "regionTabs";
      tabsEl.className = "house";
      tabsEl.style.marginBottom = "14px";
      const wrap = document.querySelector("#c .scroll-wrapper");
      wrap.parentNode.insertBefore(tabsEl, wrap);
    }

    tabsEl.innerHTML = regions.map((r) => `
      <button type="button" style="--c:#3a2e75;--t:#e6c27a" aria-pressed="${this.activeRegion === r}" onclick="app.activeRegion='${r}';app.renderMap()">
        ${this.esc(r)}
      </button>
    `).join("");

    const svgEl = document.querySelector("#mapStage svg");
    if (svgEl) svgEl.innerHTML = this.getRegionSvg(this.activeRegion);

    document.getElementById("mapPins").innerHTML = filtered.map((sp) => {
      const subName = sp.name.includes("－") ? sp.name.split("－").slice(1).join("－") : sp.name;
      return `<button type="button" class="pin" style="left:${sp.x}%;top:${sp.y}%" aria-pressed="${this.activeSpotId === sp.id}" onclick="app.activeSpotId='${sp.id}';app.renderMap()"><i></i><span>${this.esc(subName)}</span></button>`;
    }).join("");

    const sp = this.data.spots.find((s) => s.id === this.activeSpotId) || filtered.at(0);
    const panel = document.getElementById("spotDetail");
    if (!sp) { panel.innerHTML = `<p style="text-align:center;color:var(--muted);margin:0">尚未建立任何地圖地點。</p>`; return; }
    panel.innerHTML = `<div class="spot-head"><div><h3>✦ ${this.esc(sp.name)} <span class="en-name fell">${this.esc(sp.enName || "")}</span></h3></div><div class="admin-only" style="gap:6px"><button class="btn btn-sm" onclick="app.openSpotModal('${sp.id}')">編輯地點</button><button class="btn btn-sm btn-danger" onclick="app.deleteSpot('${sp.id}')">刪除</button></div></div><p class="spot-desc">${this.esc(sp.desc || "")}</p><div class="snap">${(sp.photos || []).map((p, i) => { const sk = `sp_${sp.id}_${i}`; return `<figure class="pol${magicFx.isStarred(sk) ? " starred" : ""}" data-star-key="${sk}" onclick="magicFx.handlePolClick(event,'${sk}',()=>app.openSpotLightbox('${sp.id}',${i}))"><span class="pol-seal" aria-hidden="true">✦</span>${p.url ? `<img src="${p.url}" loading="lazy">` : `<div class="ph" style="--h:${p.hue || 250}">${this.esc(sp.name)}<br><small>(待上傳團拍)</small></div>`}<figcaption>${this.esc(p.caption || "")}</figcaption></figure>`; }).join("") || `<p style="color:var(--muted);font-size:14px">此地點尚無團拍照片。</p>`}</div>`;

openSpotLightbox(id, idx) {
    const sp = this.data.spots.find((s) => s.id === id);
    if (!sp || !sp.photos.length) return;
    lb.open(sp.photos.map((p, i) => ({
      url: p.url || this.makePh(p.hue || 250, sp.name, p.caption || `留影 #${i + 1}`),
      title: sp.name,
      sub: p.caption || ""
    })), idx);
  },
  openSpotModal(id = null) {
    const sp = id ? this.data.spots.find((s) => s.id === id) : null;
    this.tempPhotos = sp ? JSON.parse(JSON.stringify(sp.photos || [])) : [];
    this.showModal(`<h3>${sp ? "編輯地圖地點" : "新增地圖地點"}</h3>
      <div class="field"><label>地點名稱</label><input type="text" id="fSpName" value="${sp ? this.esc(sp.name) : ""}"></div>
      <div class="field-row"><div class="field"><label>水平位置 X（5～95%）</label><input type="number" id="fSpX" min="5" max="95" value="${sp ? sp.x : 50}"></div><div class="field"><label>垂直位置 Y（5～95%）</label><input type="number" id="fSpY" min="5" max="95" value="${sp ? sp.y : 50}"></div></div>
      <div class="field"><label>場景介紹</label><textarea id="fSpDesc">${sp ? this.esc(sp.desc) : ""}</textarea></div>
      <div class="field"><label>該地點團拍照片（自動壓縮）</label><input type="file" accept="image/*" multiple onchange="app.uploadPhotos(event,10,true)"><div class="preview-grid" id="modalPhotoGrid"></div></div>
      <div class="modal-footer"><button type="button" class="btn btn-ghost" onclick="app.closeModal()">取消</button><button type="button" class="btn" onclick="app.saveSpot('${id || ""}')">儲存</button></div>`);
    this.renderModalGrid();
  },
  async saveSpot(id) {
    const name = document.getElementById("fSpName").value.trim();
    if (!name) return alert("請輸入地點名稱！");
    const obj = { name, x: Math.min(95, Math.max(5, Number(document.getElementById("fSpX").value) || 50)), y: Math.min(95, Math.max(5, Number(document.getElementById("fSpY").value) || 50)), desc: document.getElementById("fSpDesc").value.trim(), photos: this.tempPhotos };
    if (id) Object.assign(this.data.spots.find((s) => s.id === id), obj);
    else { const nid = "sp_" + Date.now(); this.data.spots.push({ id: nid, ...obj }); this.activeSpotId = nid; }
    this.closeModal(); await this.persist();
  },
  async deleteSpot(id) { if (confirm("確定刪除此地點？")) { this.data.spots = this.data.spots.filter((s) => s.id !== id); this.activeSpotId = this.data.spots.at(0)?.id || null; await this.persist(); } },

async uploadPhotos(e, max, withDate = false) {
    const today = new Date().toISOString().slice(0, 10);
    const grid = document.getElementById("modalPhotoGrid");
    if (grid) grid.insertAdjacentHTML("beforebegin", `<div id="uploadHint" style="color:var(--gold);font-size:13px;margin-top:6px">✦ 正在上傳照片至 Cloudinary，請稍候...</div>`);
    try {
      for (const f of Array.from(e.target.files || [])) {
        if (this.tempPhotos.length >= max) { alert(`最多上傳 ${max} 張照片。`); break; }
        const compressed = await compressImage(f);
        const url = await StorageAdapter.uploadDataUrl(compressed, "photos");
        const item = { url, hue: Math.floor(Math.random() * 360), caption: "" };
        if (withDate) item.date = today;
        this.tempPhotos.push(item);
        this.renderModalGrid();
      }
    } finally {
      document.getElementById("uploadHint")?.remove();
      e.target.value = "";
    }
  },
renderModalGrid() {
    const g = document.getElementById("modalPhotoGrid");
    if (!g) return;
    g.style.gridTemplateColumns = "repeat(auto-fill,minmax(120px,1fr))";
    g.innerHTML = this.tempPhotos.map((p, i) => `
      <div class="preview-item" data-photo-idx="${i}" draggable="true" style="aspect-ratio:auto;display:flex;flex-direction:column;background:#100c30;padding:4px">
        <div style="position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden">
          ${p.url ? `<img src="${p.url}" draggable="false">` : `<div class="ph" style="--h:${p.hue || 250};font-size:11px">佔位圖</div>`}
          <button type="button" onclick="app.tempPhotos.splice(${i},1);app.renderModalGrid()">✕</button>
        </div>
        <input type="text" placeholder="副標題（可留白）" value="${this.esc(p.caption || "")}" oninput="app.tempPhotos[${i}].caption=this.value" style="margin-top:4px;font-size:12px;padding:4px 6px;background:#171244;border:1px solid var(--line);border-radius:4px;color:var(--ink)">
      </div>
    `).join("");
    this.bindPhotoDrag();
  },
  dragPhotoIdx: null,
  bindPhotoDrag() {
    const g = document.getElementById("modalPhotoGrid");
    if (!g) return;
    const items = g.querySelectorAll(".preview-item");
    items.forEach((item) => {
      item.addEventListener("dragstart", (e) => {
        if (e.target.closest("button,input")) { e.preventDefault(); return; }
        this.dragPhotoIdx = Number(item.dataset.photoIdx);
        item.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      });
      item.addEventListener("dragend", () => {
        this.dragPhotoIdx = null;
        items.forEach((el) => el.classList.remove("dragging", "drag-over"));
      });
      item.addEventListener("dragover", (e) => {
        const targetIdx = Number(item.dataset.photoIdx);
        if (this.dragPhotoIdx === null || targetIdx === this.dragPhotoIdx) return;
        e.preventDefault();
        item.classList.add("drag-over");
      });
      item.addEventListener("dragleave", () => item.classList.remove("drag-over"));
      item.addEventListener("drop", (e) => {
        e.preventDefault();
        item.classList.remove("drag-over");
        const targetIdx = Number(item.dataset.photoIdx);
        if (this.dragPhotoIdx === null || targetIdx === this.dragPhotoIdx) return;
        const [moved] = this.tempPhotos.splice(this.dragPhotoIdx, 1);
        this.tempPhotos.splice(targetIdx, 0, moved);
        this.dragPhotoIdx = null;
        this.renderModalGrid();
      });
    });
  },
  exportBackup() {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(this.data, null, 2)], { type: "application/json" }));
    a.download = `magic-album-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  },
  async importBackup(e) {
    const f = e.target.files && e.target.files.item(0);
    if (!f) return;
    try { const d = JSON.parse(await f.text()); if (d.events && d.wizards && d.spots) { this.data = d; await this.persist(); alert("匯入成功！"); } } catch { alert("檔案格式錯誤。"); }
    e.target.value = "";
  },
  showModal(html) { document.getElementById("editorContent").innerHTML = html; document.getElementById("editorModal").classList.add("open"); },
  closeModal() { document.getElementById("editorModal").classList.remove("open"); },
  formatDate(s) { const m = (s || "").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m.at(1)} 年 ${Number(m.at(2))} 月 ${Number(m.at(3))} 日` : (s || ""); },
  esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); },
  makePh(hue, t, sub) {
    const c = document.createElement("canvas"); c.width = 800; c.height = 600;
    const ctx = c.getContext("2d"), g = ctx.createLinearGradient(0, 0, 800, 600);
    g.addColorStop(0, `hsl(${hue},40%,45%)`); g.addColorStop(1, `hsl(${(hue + 35) % 360},45%,22%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, 800, 600);
    ctx.fillStyle = "#fff6dc"; ctx.font = "bold 30px serif"; ctx.textAlign = "center"; ctx.fillText(t, 400, 285);
    ctx.font = "italic 20px serif"; ctx.fillStyle = "rgba(255,246,220,.8)"; ctx.fillText(sub, 400, 328);
    return c.toDataURL("image/jpeg", 0.8);
  }
};

const mapCtrl = {
  scale: 1, x: 0, y: 0, dragging: false, sx: 0, sy: 0,
  init() {
    const vp = document.getElementById("mapViewport"), st = document.getElementById("mapStage");
    vp.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; this.dragging = true; this.sx = e.clientX - this.x; this.sy = e.clientY - this.y; st.classList.add("dragging"); vp.setPointerCapture(e.pointerId); });
    vp.addEventListener("pointermove", (e) => { if (!this.dragging) return; this.x = e.clientX - this.sx; this.y = e.clientY - this.sy; this.apply(); });
    const end = () => { this.dragging = false; st.classList.remove("dragging"); };
    vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);
    vp.addEventListener("wheel", (e) => { e.preventDefault(); this.zoom(e.deltaY < 0 ? 0.2 : -0.2); }, { passive: false });
  },
  zoom(d) { this.scale = Math.min(2.6, Math.max(1, +(this.scale + d).toFixed(2))); if (this.scale === 1) { this.x = 0; this.y = 0; } this.apply(); },
  reset() { this.scale = 1; this.x = 0; this.y = 0; this.apply(); },
  apply() { document.getElementById("mapStage").style.transform = `translate(${this.x}px,${this.y}px) scale(${this.scale})`; }
};

const lb = {
  items: [], idx: 0,
  open(items, idx = 0) { this.items = items; this.idx = idx; this.render(); document.getElementById("lightbox").classList.add("open"); },
  close() { document.getElementById("lightbox").classList.remove("open"); },
  step(d) { if (this.items.length) { this.idx = (this.idx + d + this.items.length) % this.items.length; this.render(); } },
  render() { const it = this.items.at(this.idx); if (!it) return; document.getElementById("lbImg").src = it.url; document.getElementById("lbCap").innerHTML = `<strong>${app.esc(it.title)}</strong><small>${app.esc(it.sub)}（${this.idx + 1} / ${this.items.length}）</small>`; }
};
const cropper = {
  resolve: null, ratio: 1, imgEl: null, boxEl: null, frameEl: null,
  rect: { x: 0, y: 0, w: 100, h: 100 }, mode: null, start: { x: 0, y: 0, rx: 0, ry: 0, rw: 0, rh: 0 },

  open(file, ratio = 3 / 4, title = "拖曳框選裁切範圍") {
    this.ratio = ratio;
    document.getElementById("cropTitle").textContent = "✦ " + title;
    return new Promise((res) => {
      this.resolve = res;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        this.imgEl = document.getElementById("cropImg");
        this.boxEl = document.getElementById("cropBox");
        this.frameEl = document.getElementById("cropFrame");
        this.imgEl.src = ev.target.result;
        try { await this.imgEl.decode(); } catch (e) {}
        document.getElementById("cropModal").classList.add("open");
        requestAnimationFrame(() => this.initFrame());
      };
      reader.onerror = () => res(null);
      reader.readAsDataURL(file);
    });
  },
  initFrame() {
    const bw = this.boxEl.clientWidth || 320;
    const bh = this.boxEl.clientHeight || 320;
    let w = bw * 0.75, h = w / this.ratio;
    if (h > bh * 0.85) { h = bh * 0.85; w = h * this.ratio; }
    this.rect = { x: (bw - w) / 2, y: (bh - h) / 2, w, h };
    this.updateFrame();
    this.bindEvents();
  },

  updateFrame() {
    const { x, y, w, h } = this.rect;
    Object.assign(this.frameEl.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  },

  bindEvents() {
    const onDown = (e, mode) => {
      e.preventDefault(); e.stopPropagation();
      this.mode = mode;
      const pt = e.touches ? e.touches[0] : e;
      this.start = { x: pt.clientX, y: pt.clientY, rx: this.rect.x, ry: this.rect.y, rw: this.rect.w, rh: this.rect.h };
    };
    this.frameEl.onpointerdown = (e) => onDown(e, e.target.id === "cropHandle" ? "resize" : "move");

    window.onpointermove = (e) => {
      if (!this.mode) return;
      const dx = e.clientX - this.start.x, dy = e.clientY - this.start.y;
      const bw = this.boxEl.clientWidth, bh = this.boxEl.clientHeight;
      if (this.mode === "move") {
        this.rect.x = Math.max(0, Math.min(bw - this.rect.w, this.start.rx + dx));
        this.rect.y = Math.max(0, Math.min(bh - this.rect.h, this.start.ry + dy));
      } else if (this.mode === "resize") {
        let nw = Math.max(60, this.start.rw + dx);
        let nh = nw / this.ratio;
        if (this.start.rx + nw > bw) { nw = bw - this.start.rx; nh = nw / this.ratio; }
        if (this.start.ry + nh > bh) { nh = bh - this.start.ry; nw = nh * this.ratio; }
        this.rect.w = nw; this.rect.h = nh;
      }
      this.updateFrame();
    };
    window.onpointerup = () => { this.mode = null; };
  },

  confirm() {
    const scaleX = this.imgEl.naturalWidth / this.boxEl.clientWidth;
    const scaleY = this.imgEl.naturalHeight / this.boxEl.clientHeight;
    const sx = this.rect.x * scaleX, sy = this.rect.y * scaleY;
    const sw = this.rect.w * scaleX, sh = this.rect.h * scaleY;

    const maxDim = 1000;
    const outW = sw > sh ? maxDim : Math.round(maxDim * (sw / sh));
    const outH = sh >= sw ? maxDim : Math.round(maxDim * (sh / sw));

    const canvas = document.createElement("canvas");
    canvas.width = outW; canvas.height = outH;
    canvas.getContext("2d").drawImage(this.imgEl, sx, sy, sw, sh, 0, 0, outW, outH);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
    this.cleanup(dataUrl);
  },

  cancel() { this.cleanup(null); },

  cleanup(result) {
    document.getElementById("cropModal").classList.remove("open");
    window.onpointermove = null; window.onpointerup = null;
    if (this.resolve) { this.resolve(result); this.resolve = null; }
  }

  getWeights(n) {
    if (n === 3) {

  startByIndex(idx) {
    const item = (this._choices || [])[idx];

    img.crossOrigin = "anonymous";
    img.onload = () => {
      const isMobile = window.innerWidth <= 600;
      const ratio = img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 4 / 3;
      const maxW = isMobile ? Math.min(240, window.innerWidth - 90) : Math.min(350, window.innerWidth - 140);
      const maxH = isMobile ? 185 : 270;

      let boardW = Math.round(maxW);
      let boardH = Math.round(boardW / ratio);
      if (boardH > maxH) {
        boardH = Math.round(maxH);
        boardW = Math.round(boardH * ratio);
      }
      this.boardRect = { w: Math.max(150, boardW), h: Math.max(130, boardH) };

      const { cols, rows } = this.getWeights(this.size);
      this.colWeights = cols;
      this.rowWeights = rows;

      const colSum = cols.reduce((a, b) => a + b, 0);
      const rowSum = rows.reduce((a, b) => a + b, 0);

      const colRanges = [];
      let accX = 0;
      for (const w of cols) {
        const nextX = accX + w / colSum;
        colRanges.push([accX, nextX]);
        accX = nextX;
      }
      colRanges[colRanges.length - 1][1] = 1;

      const rowRanges = [];
      let accY = 0;
      for (const h of rows) {
        const nextY = accY + h / rowSum;
        rowRanges.push([accY, nextY]);
        accY = nextY;
      }
      rowRanges[rowRanges.length - 1][1] = 1;

      const trayScale = isMobile ? 0.44 : 0.52;
      this.pieces = [];
      for (let r = 0; r < this.size; r++) {
        for (let c = 0; c < this.size; c++) {

          const sx = x0 * img.naturalWidth;
          const sy = y0 * img.naturalHeight;
          const sw = (x1 - x0) * img.naturalWidth;
          const sh = (y1 - y0) * img.naturalHeight;

          const slotW = (x1 - x0) * this.boardRect.w;
          const slotH = (y1 - y0) * this.boardRect.h;

          const canvas = document.createElement("canvas");
          canvas.width = Math.max(24, Math.round(slotW * 2));
          canvas.height = Math.max(24, Math.round(slotH * 2));
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

          this.pieces.push({
            id: idPiece,
            placedAt: null,
            solved: false,
            dataUrl: canvas.toDataURL("image/jpeg", 0.88),
            w: Math.max(28, Math.round(slotW)),
            h: Math.max(28, Math.round(slotH)),
            trayW: Math.max(32, Math.round(slotW * trayScale)),
            trayH: Math.max(32, Math.round(slotH * trayScale))
          });
        }
      }

      this.shuffle();
      this.renderGame();
    };
    img.onerror = () => {

    };

        <button type="button" class="btn btn-sm btn-ghost" onclick="puzzle.openPicker()">換圖</button>
      </div>
      <div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:6px">
        已歸位 ${solvedCount} / ${total} 片 ・ 步數：${this.moves}
      </div>
      <div class="puzzle-board" id="puzzleBoard" style="width:${this.boardRect.w}px;height:${this.boardRect.h}px">
        ${this.showHint && this.meta?.url ? `<img class="puzzle-ghost" src="${app.esc(this.meta.url)}" alt="">` : ""}
        <div class="puzzle-grid" style="grid-template-columns:${gridCols};grid-template-rows:${gridRows}">
          ${Array.from({ length: total }, (_, slotIdx) => {
            const placed = this.pieces.find((p) => p.placedAt === slotIdx);
            return `
              <div class="puzzle-slot ${placed?.solved ? "solved" : ""}" data-slot="${slotIdx}">
                ${placed ? `<img class="puzzle-piece ${placed.solved ? "solved" : ""}" src="${placed.dataUrl}" data-piece="${placed.id}" style="width:100%;height:100%;object-fit:fill" draggable="false">` : ""}
              </div>
            `;
          }).join("")}
        </div>
      </div>
      <div class="puzzle-tray-wrap">
        <button type="button" class="puzzle-nav-btn" aria-label="向左切換拼圖碎片" onclick="puzzle.scrollTray(-1)">‹</button>
        <div class="puzzle-tray" id="puzzleTray">
          ${trayPieces.length
            ? trayPieces.map((p) => `<img class="puzzle-piece" src="${p.dataUrl}" data-piece="${p.id}" style="width:${p.trayW}px;height:${p.trayH}px" draggable="false">`).join("")
            : `<span style="font-size:12px;color:var(--muted);margin:0 auto">所有拼片都已放上棋盤！</span>`}
        </div>
        <button type="button" class="puzzle-nav-btn" aria-label="向右切換拼圖碎片" onclick="puzzle.scrollTray(1)">›</button>
      </div>
      ${isWin ? `<div class="puzzle-win">✦ 拼圖完成！《${app.esc(this.meta?.evTitle || "")}》的回憶完整重現了！</div>` : ""}
      <div class="modal-footer">
        ${isWin ? `<button type="button" class="btn btn-sm" onclick="puzzle.shuffle();puzzle.renderGame()">再玩一次</button>` : ""}
        <button type="button" class="btn btn-sm btn-ghost" onclick="app.closeModal()">關閉</button>
      </div>
    `);
    this.bindDrag();
  },

  bindDrag() {
    const piecesEls = document.querySelectorAll("#editorContent .puzzle-piece:not(.solved)");
    piecesEls.forEach((el) => {
      el.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        const id = Number(el.dataset.piece);
        const piece = this.pieces.find((x) => x.id === id);
        if (!piece || piece.solved) return;

        const ghost = document.createElement("img");
        ghost.src = piece.dataUrl;
        ghost.className = "puzzle-floating";
        ghost.style.width = piece.w + "px";
        ghost.style.height = piece.h + "px";
        ghost.style.left = e.clientX + "px";
        ghost.style.top = e.clientY + "px";
        document.body.appendChild(ghost);

        this.dragState = { piece, ghost };
        this.highlightSlotAt(e.clientX, e.clientY);
      });
    });

    const onMove = (e) => {
      if (!this.dragState) return;
      this.dragState.ghost.style.left = e.clientX + "px";
      this.dragState.ghost.style.top = e.clientY + "px";
      this.highlightSlotAt(e.clientX, e.clientY);
    };

    const onUp = (e) => {
      if (!this.dragState) return;
      const { piece, ghost } = this.dragState;
      const targetSlot = this.findSlotAt(e.clientX, e.clientY);
      ghost.remove();
      document.querySelectorAll(".puzzle-slot.over").forEach((s) => s.classList.remove("over"));
      this.dragState = null;

      if (targetSlot !== null) {
        const occupant = this.pieces.find((p) => p.placedAt === targetSlot && p.id !== piece.id);
        if (occupant && !occupant.solved) {
          occupant.placedAt = null;
        }
        if (!occupant || !occupant.solved) {
          piece.placedAt = targetSlot;
          this.moves++;
          if (piece.id === targetSlot) {
            piece.solved = true;
          }
        }
      } else if (piece.placedAt !== null && !piece.solved) {
        piece.placedAt = null;
        this.moves++;
      }

      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      this.renderGame();
    };

    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  },

  findSlotAt(x, y) {
    const slots = document.querySelectorAll("#puzzleBoard .puzzle-slot");
    for (const slot of slots) {
      const r = slot.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
        return Number(slot.dataset.slot);
      }
    }
    return null;
  },

  highlightSlotAt(x, y) {
    const hovered = this.findSlotAt(x, y);
    document.querySelectorAll("#puzzleBoard .puzzle-slot").forEach((slot) => {
      slot.classList.toggle("over", Number(slot.dataset.slot) === hovered);
    });
  }
};

window.addEventListener("DOMContentLoaded", () => { mapCtrl.init(); magicFx.initWandDust(); initHallAmbience(); app.init(); });
